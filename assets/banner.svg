<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
      100% { transform: scale(1); opacity: 0.25; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -120; }
    }
    @keyframes beaconRing {
      0% { r: 6; opacity: 1; }
      100% { r: 24; opacity: 0; }
    }

    .bg-grid { fill: url(#techGrid); }
    .orb-cyan { transform-origin: 200px 100px; animation: pulseOrb 8s ease-in-out infinite; }
    .orb-purple { transform-origin: 1000px 320px; animation: pulseOrb 10s ease-in-out infinite reverse; }
    .stream-line { stroke: url(#wireGrad); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 16; animation: dashTravel 4s linear infinite; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .beacon { animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" class="bg-grid" />

  <!-- Ambient Light Orbs (Background Only) -->
  <circle cx="220" cy="110" r="160" fill="url(#accentCyan)" filter="url(#softGlow)" class="orb-cyan" />
  <circle cx="980" cy="300" r="180" fill="url(#accentPurple)" filter="url(#softGlow)" class="orb-purple" />

  <!-- Dynamic Migration Data Flow Streams (Behind Foreground Content) -->
  <path d="M 80 340 C 300 340, 380 70, 600 70 C 820 70, 900 330, 1120 330" fill="none" class="stream-line" opacity="0.6" />
  <path d="M 120 370 C 350 370, 420 100, 600 100 C 780 100, 850 360, 1080 360" fill="none" class="stream-line" opacity="0.3" style="animation-duration: 6s; animation-direction: reverse;" />

  <!-- Animated Particles in Background -->
  <g class="particle-1">
    <circle cx="280" cy="220" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="750" cy="80" r="2.5" fill="#c084fc" filter="url(#glow)" />
  </g>
  <g class="particle-2">
    <circle cx="450" cy="110" r="3" fill="#818cf8" filter="url(#glow)" />
    <circle cx="920" cy="240" r="4" fill="#38bdf8" filter="url(#glow)" />
  </g>
  <g class="particle-3">
    <circle cx="160" cy="180" r="2" fill="#38bdf8" />
    <circle cx="1040" cy="130" r="3.5" fill="#f43f5e" filter="url(#glow)" />
  </g>

  <!-- Network Node Beacons -->
  <g transform="translate(180, 290)">
    <circle cx="0" cy="0" r="8" fill="#38bdf8" fill-opacity="0.3" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <circle cx="0" cy="0" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon" />
  </g>
  <g transform="translate(1020, 140)">
    <circle cx="0" cy="0" r="8" fill="#c084fc" fill-opacity="0.3" />
    <circle cx="0" cy="0" r="4" fill="#c084fc" />
    <circle cx="0" cy="0" fill="none" stroke="#c084fc" stroke-width="1.5" class="beacon" />
  </g>

  <!-- Foreground Content Block (High Contrast & Clear Hierarchy) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)" />
      <circle cx="-142" cy="0" r="5" fill="#10b981" />
      <text x="-124" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="1.5">CURATED AWESOME REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Cloud Migration
    </text>
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc" letter-spacing="0.2">
      Management &amp; Modernization
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Discovery • Assessment • 7Rs Strategy • Workload Mobility • Automated Cutover
    </text>

    <!-- Feature Attribute Badges (Foreground Cards) -->
    <g transform="translate(600, 335)">
      <!-- Card 1 -->
      <g transform="translate(-360, 0)">
        <rect x="-95" y="-20" width="190" height="40" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#38bdf8">☁️ Multi-Cloud &amp; Hybrid</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(-120, 0)">
        <rect x="-95" y="-20" width="190" height="40" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#a78bfa">🎯 7Rs Assessment Hub</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(120, 0)">
        <rect x="-95" y="-20" width="190" height="40" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#34d399">⚡ Minimal Downtime</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(360, 0)">
        <rect x="-95" y="-20" width="190" height="40" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#f472b6">🌟 Top Open-Source &amp; SaaS</text>
      </g>
    </g>
  </g>
</svg>
